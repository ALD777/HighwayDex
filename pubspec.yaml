name: highwaydex
description: "HighwayRx is a safety-conscious highway tracker built with Flutter."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^13.0.1
  geocoding: ^5.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  sqflite: ^2.4.2+1
  path_provider: ^2.1.6
  http: ^1.3.0
  google_sign_in: ^6.2.2
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.3
  tutorial_coach_mark: ^1.3.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.13.1 # use the latest version
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter_icons:
  android: true
  ios: true
  image_path: "assets/iconapp.png"
flutter:
  uses-material-design: true
